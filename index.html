const STEPS = ['ایجاد معامله و دعوت', 'تأیید طرف مقابل', 'بلوکه مبلغ توسط خریدار', 'ارسال کالا توسط فروشنده', 'تأیید دریافت و آزادسازی وجه'];
const DONE = { invited: 1, accepted: 2, funded: 3, delivered: 4, released: 5, cancelled: 0 };
function status(d) {
  return {
    invited: d.byMe ? ['منتظر تأیید طرف مقابل', 'wait', 'clock'] : ['دعوت جدید', 'wait', 'send'],
    accepted: ['منتظر بلوکه مبلغ', 'wait', 'clock'],
    funded: ['مبلغ بلوکه شد', 'done', 'lock'],
    delivered: ['منتظر تأیید دریافت', 'wait', 'truck'],
    released: ['تسویه شد', 'done', 'check'],
    cancelled: ['لغو شد', 'off', 'x'],
    disputed: ['در داوری', 'wait', 'alert'],
  }[d.status];
}
const stWord = d => { const [l, tone, icon] = status(d); return `<span class="st st-${tone}">${ic(icon)}${l}</span>`; };
const needsMe = d => (d.status === 'invited' && !d.byMe) || (d.status === 'accepted' && d.role === 'buyer') || (d.status === 'funded' && d.role === 'seller') || (d.status === 'delivered' && d.role === 'buyer');
const todo = d => ({ invited: ['دعوت را بررسی کنید', 'بررسی'], accepted: ['مبلغ را بلوکه کنید', 'بلوکه'], funded: ['ارسال کالا را ثبت کنید', 'ثبت ارسال'], delivered: ['دریافت کالا را تأیید کنید', 'تأیید'] }[d.status]);
const isClosed = d => ['released', 'cancelled'].includes(d.status);
const other = d => d.role === 'buyer' ? 'فروشنده' : 'خریدار';
const initial = name => (String(name || '').replace(/^(شرکت|بازرگانی|صنایع|تجهیزات صنعتی|تجهیزات|پخش)\s+/, '').trim()[0]) || 'ط';
const addLog = (d, text) => d.log.push({ t: Date.now(), text });
const money = (n, cls = 'fig') => `<span class="${cls} num">${ui.hide ? '••••••' : fa(n)} <span class="unit">تومان</span></span>`;

// ---------- views ----------
function authView() {

        <p class="err" id="phone-err">${esc(a.err)}</p></div>

      <div class="field"><label for="nid">کد ملی</label>
        <input id="nid" name="nid" class="input ltr num" type="text" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="۱۰ رقم" value="${esc(faD(a.nid))}" ${a.err ? 'aria-invalid="true" aria-describedby="nid-err"' : ''}>

      <button type="button" class="link" data-act="auth-back">تغییر شماره موبایل</button>
    </form>`;
  else {
    const left = Math.max(0, 60 - Math.floor((Date.now() - a.sentAt) / 1000));
    body = `<form class="stack" data-form="otp" novalidate>
      <h1>${a.nid ? 'تأیید شماره موبایل' : 'ورود با کد یک‌بارمصرف'}</h1>
      <p class="muted">کد ۵ رقمی پیامک‌شده به <span class="num">${faD(a.phone)}</span> را وارد کنید.</p>
      <div class="field"><label for="otp">کد تأیید</label>
        <div class="otp ${a.err ? 'bad' : ''}"><input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="5" ${a.err ? 'aria-describedby="otp-err"' : ''}>${'<span class="num"></span>'.repeat(5)}</div>
        <p class="err" id="otp-err">${esc(a.err)}</p></div>
      <p class="demo">${ic('clock', 'sm')}در نمونه اولیه پیامکی ارسال نمی‌شود. کد این بار: <b class="num">${faD(a.code)}</b></p>
      <button type="submit" class="btn wide">${a.nid ? 'ساخت حساب و ورود' : 'ورود'}</button>
      <div class="row-links">
        <button type="button" class="link" data-act="auth-back">تغییر شماره موبایل</button>
        <button type="button" class="link num" id="resend" data-act="resend" ${left ? 'disabled' : ''}>${left ? `ارسال دوباره تا ${fa(left)} ثانیه` : 'ارسال دوباره کد'}</button>
      </div>
    </form>`;
  }
  return `<div class="wrap sub"><div class="auth">${head}<section class="glass auth-panel">${body}</section></div></div>`;

const TABS = [['home', 'خانه', 'home'], ['deals', 'معاملات', 'deals'], ['credit', 'اعتبار', 'credit'], ['profile', 'حساب', 'user']];
function shell() {

    : `<header class="bar"><span class="brand">${ic('shield')}سپار</span><nav class="bar-nav" aria-label="بخش‌های اصلی">${TABS.slice(0, 3).map(([id, label, icon]) => `<button type="button" data-act="tab" data-id="${id}" ${v === id ? 'aria-current="page"' : ''}>${ic(icon)}${label}</button>`).join('')}</nav><div class="end"><button type="button" class="icon-btn" data-act="tab" data-id="profile" aria-label="حساب کاربری">${ic('user')}</button></div></header>`;
  const tabs = sub ? '' : `<nav class="tabs" aria-label="بخش‌های اصلی"><ul>${TABS.map(([id, label, icon]) => `<li><button type="button" data-act="tab" data-id="${id}" ${v === id ? 'aria-current="page"' : ''}>${ic(icon)}${label}</button></li>`).join('')}</ul></nav>`;
  return `<div class="wrap ${sub ? 'sub' : ''}">${bar}<main>${body}</main></div>${tabs}`;
}

function dealRow(d) {

}

  return `<div class="screen split"><div class="col">

    </div><div class="col">

        <li><p><b>بلوکه مبلغ</b><span>پس از تأیید هر دو طرف، خریدار مبلغ را نزد سپار بلوکه می‌کند.</span></p></li>
        <li><p><b>ارسال کالا</b><span>فروشنده با خیال راحت کالا را می‌فرستد و بارنامه را ثبت می‌کند.</span></p></li>

      </ol>

  </div></div>`;

const FILTERS = [['all', 'همه', () => true], ['me', 'منتظر من', needsMe], ['open', 'در جریان', d => !needsMe(d) && !isClosed(d)], ['closed', 'بسته‌شده', isClosed]];

    <div class="filters" role="group" aria-label="فیلتر معاملات">${FILTERS.map(([id, label, fn]) => `<button type="button" data-act="filter" data-id="${id}" aria-pressed="${ui.filter === id}">${label} <span class="count num">${fa(a.deals.filter(fn).length)}</span></button>`).join('')}</div>

      : `<div class="glass empty">${ic('deals')}<p>${ui.filter === 'me' ? 'کاری منتظر شما نیست.' : 'معامله‌ای در این دسته نیست.'}</p><button type="button" class="btn ghost" data-act="tab" data-id="create">ساخت معامله امن</button></div>`}

}

function createView() {

    <p class="muted">پس از تأیید طرف مقابل، خریدار مبلغ را نزد سپار بلوکه می‌کند و وجه فقط پس از تأیید دریافت کالا به فروشنده می‌رسد.</p>

      <input type="radio" name="role" id="r-seller" value="seller"><label for="r-seller">${ic('truck')}<b>فروشنده هستم</b><span>کالا را ارسال می‌کنم</span></label>

function dealView() {
  const a = acc(), d = a.deals.find(x => x.id === ui.dealId);
  if (!d) { ui.view = 'deals'; return dealsView(); }
  const me = d.role, done = d.status === 'disputed' ? DONE[d.prev] : DONE[d.status];
  const held = ['funded', 'delivered', 'disputed'].includes(d.status), paid = d.status === 'released';
  const meP = `<div class="party"><span class="ini lg me" aria-hidden="true">ش</span><b>شما</b><span>${me === 'buyer' ? 'خریدار' : 'فروشنده'}</span></div>`;
  const cpP = `<div class="party"><span class="ini lg" aria-hidden="true">${esc(initial(d.cpName))}</span><b>${esc(d.cpName || faD(d.cpPhone))}</b><span>${other(d)}</span></div>`;
  const vaultNote = paid ? [ic('check', 'sm'), 'به حساب فروشنده واریز شد'] : held ? [ic('lock', 'sm'), d.source === 'credit' ? 'نزد سپار بلوکه است، از محل اعتبار خریدار' : 'نزد سپار بلوکه است'] : d.status === 'cancelled' ? [ic('x', 'sm'), 'وجهی جابه‌جا نشد'] : [ic('unlock', 'sm'), 'هنوز بلوکه نشده است'];

  let next = null, primary = '', secondary = '', sim = '';
  const B = (act, label, cls = 'btn') => `<button type="button" class="${cls}" data-act="${act}" data-id="${d.id}">${label}</button>`;
  if (d.status === 'invited' && !d.byMe) { next = ['دعوت به این معامله', `${esc(d.cpName || 'طرف مقابل')} شما را به عنوان ${me === 'buyer' ? 'خریدار' : 'فروشنده'} دعوت کرده است. مبلغ و شرایط تحویل را بررسی کنید.`, 'wait']; primary = B('accept', 'پذیرفتن معامله'); secondary = B('reject', 'رد دعوت', 'btn ghost'); }
  if (d.status === 'invited' && d.byMe) { next = ['منتظر تأیید طرف مقابل', `دعوت برای ${faD(d.cpPhone)} فرستاده شد.`]; secondary = B('cancel', 'لغو معامله', 'btn ghost'); sim = `${other(d)} دعوت را می‌پذیرد`; }
  if (d.status === 'accepted' && me === 'buyer') { next = ['نوبت شماست', 'هر دو طرف معامله را تأیید کرده‌اند. مبلغ را بلوکه کنید تا فروشنده کالا را ارسال کند.', 'wait']; primary = B('fund', `${ic('lock')}بلوکه کردن ${short(d.amount)} تومان`); secondary = B('cancel', 'لغو معامله', 'btn ghost'); }
  if (d.status === 'accepted' && me === 'seller') { next = ['منتظر بلوکه مبلغ', 'خریدار معامله را پذیرفته است. تا بلوکه شدن مبلغ کالا را ارسال نکنید.']; sim = 'خریدار مبلغ را بلوکه می‌کند'; }
  if (d.status === 'funded' && me === 'seller') { next = ['نوبت شماست', 'مبلغ نزد سپار بلوکه شده است. کالا را ارسال کنید و شماره بارنامه را ثبت کنید.', 'wait']; primary = B('ship', `${ic('truck')}ثبت ارسال کالا`); }
  if (d.status === 'funded' && me === 'buyer') { next = ['منتظر ارسال کالا', `فروشنده تا ${fa(d.days)} روز فرصت دارد کالا را ارسال کند.`]; secondary = B('dispute', 'ثبت اختلاف', 'btn ghost'); sim = 'فروشنده ارسال کالا را ثبت می‌کند'; }
  if (d.status === 'delivered' && me === 'buyer') { next = ['نوبت شماست', 'فروشنده ارسال را ثبت کرده است. پس از بررسی کالا دریافت را تأیید کنید. اگر کالا با شرایط معامله نمی‌خواند، اختلاف ثبت کنید.', 'wait']; primary = B('release', 'تأیید دریافت و پرداخت'); secondary = B('dispute', 'ثبت اختلاف', 'btn ghost'); }
  if (d.status === 'delivered' && me === 'seller') { next = ['منتظر تأیید خریدار', 'ارسال ثبت شد. پس از تأیید دریافت، وجه به حساب شما واریز می‌شود.']; sim = 'خریدار دریافت را تأیید می‌کند'; }
  if (d.status === 'disputed') next = ['اختلاف در حال بررسی', 'کارشناس سپار ظرف ۴۸ ساعت با هر دو طرف تماس می‌گیرد. مبلغ تا رأی نهایی بلوکه می‌ماند.', 'wait'];
  if (d.status === 'released') next = ['معامله بسته شد', me === 'seller' ? 'وجه به حساب شما واریز شد.' : 'وجه به فروشنده پرداخت شد.'];
  if (d.status === 'cancelled') next = ['معامله لغو شد', 'وجهی جابه‌جا نشد.'];

  const creator = d.byMe ? `<span class="num">${faD(S.session)}</span>` : esc(d.cpName || faD(d.cpPhone));
  const invitee = d.byMe ? other(d) : (me === 'buyer' ? 'خریدار' : 'فروشنده');

  return `<div class="screen split wide-first"><div class="col">
    <div class="d-head"><h1>${esc(d.title)}${d.sample ? '<span class="tag">نمونه</span>' : ''}</h1>${stWord(d)}</div>

    <section class="glass escrow ${held ? 'held' : paid ? 'paid' : ''}" aria-label="وضعیت وجه معامله">
      <div class="escrow-row">${me === 'buyer' ? meP : cpP}<div class="vault"><span class="vault-ic">${ic(held ? 'lock' : paid ? 'check' : 'unlock')}</span></div>${me === 'buyer' ? cpP : meP}</div>
      <div class="escrow-amt">${money(d.amount)}<p class="words">${words(d.amount)} تومان</p><p class="escrow-note">${vaultNote.join('')}</p></div>
    </section>

    ${next ? `<section class="next ${next[2] || ''}"><b>${next[0]}</b><p>${next[1]}</p></section>` : ''}
    ${sim ? `<div class="sim"><p>شبیه‌سازی طرف مقابل، فقط در نمونه اولیه</p><button type="button" class="btn quiet" data-act="sim" data-id="${d.id}">${sim}</button></div>` : ''}

    <section class="sec"><h2>مراحل معامله</h2>
      <ol class="steps">${STEPS.map((s, i) => { const st = i < done ? 'done' : i === done && !['cancelled', 'disputed', 'released'].includes(d.status) ? 'now' : ''; return `<li class="${st}"><span class="mk">${st === 'done' ? ic('check') : ''}</span><span>${s}</span></li>`; }).join('')}</ol>
    </section>

    ${primary || secondary ? `<div class="dock"><div class="actions">${primary}${secondary}</div></div>` : ''}
    </div><div class="col">
    <section class="sec"><h2>دعوت‌نامه</h2>
      <div class="well">
        <div class="card">
          <div class="card-head"><span class="brand">${ic('shield')}سپار</span><span>دعوت به معامله امن</span></div>
          <p>${creator} شما را به عنوان ${invitee} به این معامله دعوت کرده است.</p>
          <dl>
            <div><dt>موضوع</dt><dd>${esc(d.title)}</dd></div>
            <div><dt>مبلغ</dt><dd class="num">${toman(d.amount)}</dd></div>
            <div><dt>مهلت ارسال</dt><dd>${fa(d.days)} روز پس از بلوکه مبلغ</dd></div>
            <div><dt>شرایط تحویل</dt><dd>${esc(d.terms) || 'شرطی ثبت نشده است.'}</dd></div>
          </dl>
        </div>
        <p class="well-cap"><b>پیامک دعوت</b><span>آنچه ${d.byMe ? 'طرف مقابل' : 'شما'} با پیامک دریافت کرد</span></p>
      </div>
    </section>

    <section class="sec"><h2>سابقه معامله</h2><ul class="log">${[...d.log].reverse().map(l => `<li><time>${when(l.t)}</time>${esc(l.text)}</li>`).join('')}</ul></section>

  </div></div>`;
}

function creditView() {
  const a = acc(), c = credit(a), pct = c.limit ? Math.min(100, c.used / c.limit * 100) : 0;
  return `<div class="screen split"><div class="col">
    <div class="sec"><div class="sec-head"><h2>اعتبار سپار</h2></div>
    <section class="glass summary" aria-label="اعتبار سپار">
      <div class="summary-top"><span>اعتبار قابل استفاده</span><button type="button" class="icon-btn" data-act="hide" aria-label="${ui.hide ? 'نمایش مبالغ' : 'پنهان کردن مبالغ'}" aria-pressed="${ui.hide}">${ic(ui.hide ? 'eyeOff' : 'eye')}</button></div>
      ${money(c.available)}
      <div class="meter" role="img" aria-label="${fa(Math.round(pct))} درصد سقف اعتبار در حال استفاده است"><i style="width:${pct}%"></i></div>
      <dl class="tally">
        <div><dt>سقف اعتبار</dt><dd>${money(c.limit, 'num')}</dd></div>
        <div><dt>در حال استفاده</dt><dd>${money(c.used, 'num')}</dd></div>
        ${c.pending ? `<div><dt>در انتظار بررسی وثیقه</dt><dd class="st-wait">${money(c.pending, 'num')}</dd></div>` : ''}
      </dl>
    </section></div>
    <p class="muted">با اعتبار سپار می‌توانید مبلغ معامله را بدون برداشت از موجودی حساب بلوکه کنید. سقف اعتبار از ارزش وثیقه‌ها و ضریب پوشش هرکدام به دست می‌آید.</p>
    <button type="button" class="btn wide" data-act="add-coll">${ic('plus')}افزایش اعتبار با وثیقه جدید</button>
    </div><div class="col">
    <section class="sec"><div class="sec-head"><h2>وثیقه‌های شما</h2></div>
      ${a.collaterals.length ? `<div class="glass list">${[...a.collaterals].reverse().map(x => `<div class="row" style="cursor:default">
          <span class="coll-ic" aria-hidden="true">${ic(COLL[x.type].icon)}</span>
          <span class="row-main"><span class="row-title">${COLL[x.type].name}${x.sample ? '<span class="tag">نمونه</span>' : ''}</span><span class="row-sub num" dir="ltr" style="text-align:right">${esc(x.ref)}</span></span>
          <span class="row-end"><span class="amt num">${short(x.amount)}</span>${x.status === 'approved' ? `<span class="st st-done">${ic('check')}${short(x.amount * COLL[x.type].cov)} اعتبار</span>` : `<span class="st st-wait">${ic('clock')}در حال بررسی</span>`}</span>
        </div>`).join('')}</div>` : `<div class="glass empty">${ic('shield')}<p>هنوز وثیقه‌ای ثبت نکرده‌اید. با ثبت اولین وثیقه اعتبار شما ساخته می‌شود.</p></div>`}
    </section>
    <section class="sec"><h2>ضریب پوشش وثیقه‌ها</h2>
      <table class="cov"><thead><tr><th scope="col">نوع وثیقه</th><th scope="col">سهم از مبلغ وثیقه</th></tr></thead>
      <tbody>${Object.values(COLL).map(v => `<tr><td>${v.name}</td><td class="num">${fa(v.cov * 100)}٪</td></tr>`).join('')}</tbody></table>
    </section>
  </div></div>`;
}

function profileView() {
  const a = acc();
  return `<div class="screen narrow">
    <section class="glass who"><span class="ini lg me" aria-hidden="true">${ic('user')}</span><div><b class="num">${faD(S.session)}</b><span class="muted">حساب تجاری سپار</span></div></section>
    <dl class="tally">
      <div><dt>شماره موبایل</dt><dd class="num">${faD(S.session)}</dd></div>
      <div><dt>کد ملی</dt><dd class="num" dir="ltr">${faD(a.nid.slice(0, 3))}•••••${faD(a.nid.slice(-2))}</dd></div>
      <div><dt>روش ورود</dt><dd>موبایل و کد یک‌بارمصرف</dd></div>
    </dl>
    <div class="actions"><button type="button" class="btn ghost" data-act="logout">${ic('logout')}خروج از حساب</button><button type="button" class="btn quiet" data-act="reset">${ic('reset')}بازگرداندن داده‌های نمونه</button></div>
  </div>`;
}

// ---------- sheets ----------
const sheet = $('#sheet');
function openSheet(title, inner) {
  sheet.innerHTML = `<div class="sheet-in"><span class="grab" aria-hidden="true"></span><div class="sheet-head"><h2 id="sheet-title">${title}</h2><button type="button" class="icon-btn" data-act="close" aria-label="بستن">${ic('x')}</button></div>${inner}</div>`;
  sheet.showModal();
}

function fundSheet(d) {
  const a = acc(), c = credit(a);
  const opt = (v, name, icon, bal) => `<div><input type="radio" name="src" id="src-${v}" value="${v}" ${bal < d.amount ? 'disabled' : ''}><label for="src-${v}"><span class="coll-ic">${ic(icon)}</span><span><b>${name}</b><small class="num">${bal < d.amount ? 'کافی نیست، ' : 'در دسترس: '}${toman(bal)}</small></span></label></div>`;
  openSheet('بلوکه کردن مبلغ', `<form class="stack" data-form="fund" data-id="${d.id}" novalidate>
    <p class="body">${toman(d.amount)} تا پایان معامله نزد سپار می‌ماند و فقط با تأیید دریافت شما به فروشنده می‌رسد.</p>
    <fieldset class="opts"><legend class="legend">محل تأمین مبلغ</legend>${opt('wallet', 'موجودی حساب', 'bank', a.wallet)}${opt('credit', 'اعتبار سپار', 'credit', c.available)}</fieldset>
    <p class="err" id="fund-err"></p>
    <button type="submit" class="btn wide">${ic('lock')}بلوکه کردن مبلغ</button></form>`);
}

function collSheet() {
  openSheet('افزایش اعتبار', `<form class="stack" data-form="coll" novalidate>
    <fieldset class="opts"><legend class="legend">نوع وثیقه</legend>
      ${Object.entries(COLL).map(([k, v], i) => `<div><input type="radio" name="ctype" id="ct-${k}" value="${k}" ${i ? '' : 'checked'}><label for="ct-${k}"><span class="coll-ic">${ic(v.icon)}</span><span><b>${v.name}</b><small>${fa(v.cov * 100)}٪ مبلغ وثیقه به اعتبار اضافه می‌شود</small></span></label></div>`).join('')}
    </fieldset>
    <div class="field"><label for="c-amount">مبلغ وثیقه</label><div class="amount-wrap"><input id="c-amount" name="c-amount" class="input ltr num" type="text" inputmode="numeric" autocomplete="off" data-money><span>تومان</span></div><p class="words-line" id="c-amount-words"></p></div>
    <div class="field"><label for="c-ref" id="c-ref-label">${COLL.eg.ref}</label><input id="c-ref" name="c-ref" class="input ltr num" type="text" autocomplete="off"></div>
    <p class="demo" id="c-preview">مبلغ وثیقه را وارد کنید تا اعتبار حاصل از آن را ببینید.</p>
    <p class="err" id="coll-err"></p>
    <button type="submit" class="btn wide">ثبت وثیقه</button></form>`);
}

// ---------- events ----------
let toastT;
function toast(msg) {
  $('#toast').innerHTML = `<div>${ic('check')}${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => $('#toast').innerHTML = '', 4000);
}
function go(view, id) { if (view === 'deal') ui.from = ui.view; ui.view = view; if (id) ui.dealId = id; render(); window.scrollTo(0, 0); }
const findDeal = id => acc().deals.find(d => d.id === id);
function commit(msg) { save(); if (sheet.open) sheet.close(); render(); if (msg) toast(msg); }
const newCode = () => String(Math.floor(10000 + Math.random() * 90000));
const fail = (id, msg) => { const e = $('#' + id); e.textContent = msg; e.closest('form')?.querySelector('[aria-invalid], .input')?.focus(); };

const acts = {
  'tab': id => go(id),
  'open': id => go('deal', id),
  'filter': id => { ui.filter = id; render(); },
  'hide': () => { ui.hide = !ui.hide; render(); },
  'logout': () => { S.session = null; save(); ui.view = 'home'; ui.auth = { step: 'phone', phone: S.lastPhone, nid: '', code: '', sentAt: 0, err: '' }; render(); },
  'reset': () => openSheet('بازگرداندن داده‌های نمونه', `<p class="body">معاملات و وثیقه‌های این حساب پاک می‌شوند و نمونه‌های اولیه برمی‌گردند.</p><div class="actions"><button type="button" class="btn" data-act="reset-yes">بازگرداندن</button><button type="button" class="btn ghost" data-act="close">منصرف شدم</button></div>`),
  'reset-yes': () => { S.accounts[S.session] = seed(acc().nid); ui.view = 'home'; commit('داده‌های نمونه برگشت'); },
  'auth-back': () => { ui.auth.step = 'phone'; ui.auth.err = ''; ui.auth.nid = ''; render(); },
  'resend': () => { ui.auth.code = newCode(); ui.auth.sentAt = Date.now(); ui.auth.err = ''; render(); toast('کد تازه ارسال شد'); },
  'close': () => sheet.close(),
  'accept': id => { const d = findDeal(id); d.status = 'accepted'; addLog(d, 'دعوت را پذیرفتید'); commit('معامله را پذیرفتید'); },
  'reject': id => { const d = findDeal(id); d.status = 'cancelled'; addLog(d, 'دعوت را رد کردید'); commit('دعوت رد شد'); },
  'cancel': id => openSheet('لغو معامله', `<p class="body">این معامله برای هر دو طرف لغو می‌شود. هنوز وجهی جابه‌جا نشده است.</p><div class="actions"><button type="button" class="btn" data-act="cancel-yes" data-id="${id}">لغو معامله</button><button type="button" class="btn ghost" data-act="close">منصرف شدم</button></div>`),
  'cancel-yes': id => { const d = findDeal(id); d.status = 'cancelled'; addLog(d, 'معامله را لغو کردید'); commit('معامله لغو شد'); },
  'fund': id => fundSheet(findDeal(id)),
  'ship': id => openSheet('ثبت ارسال کالا', `<form class="stack" data-form="ship" data-id="${id}" novalidate>
      <div class="field"><label for="waybill">شماره بارنامه یا کد رهگیری مرسوله</label><input id="waybill" name="waybill" class="input ltr num" type="text" autocomplete="off"></div>
      <p class="err" id="ship-err"></p><button type="submit" class="btn wide">${ic('truck')}ثبت ارسال</button></form>`),
  'release': id => { const d = findDeal(id); openSheet('تأیید دریافت', `<p class="body">با تأیید شما ${toman(d.amount)} از حالت بلوکه خارج و به حساب ${esc(d.cpName || 'فروشنده')} واریز می‌شود. این کار برگشت‌پذیر نیست.</p>
      <div class="actions"><button type="button" class="btn" data-act="release-yes" data-id="${id}">تأیید دریافت و پرداخت</button><button type="button" class="btn ghost" data-act="close">هنوز نه</button></div>`); },
  'release-yes': id => { const d = findDeal(id); d.status = 'released'; addLog(d, `دریافت را تأیید کردید و ${short(d.amount)} تومان به فروشنده پرداخت شد`); commit('وجه به فروشنده پرداخت شد'); },
  'dispute': id => openSheet('ثبت اختلاف', `<form class="stack" data-form="dispute" data-id="${id}" novalidate>
      <p class="body">مبلغ تا بررسی کارشناس سپار بلوکه می‌ماند.</p>
      <div class="field"><label for="reason">مشکل چیست؟</label><textarea id="reason" name="reason" class="input" placeholder="مثلاً ۳ تن از ۲۰ تن تحویل نشده است"></textarea></div>
      <p class="err" id="dispute-err"></p><button type="submit" class="btn wide">ثبت اختلاف</button></form>`),
  'sim': id => {
    const d = findDeal(id), who = d.cpName || other(d), a = acc();
    if (d.status === 'invited') { d.status = 'accepted'; addLog(d, `${who} دعوت را پذیرفت`); }
    else if (d.status === 'accepted') { d.status = 'funded'; d.source = 'buyer'; addLog(d, `${who} ${short(d.amount)} تومان بلوکه کرد`); }
    else if (d.status === 'funded') { d.status = 'delivered'; addLog(d, `${who} ارسال کالا را ثبت کرد (بارنامه ${faD('4471' + Math.floor(Math.random() * 1e5))})`); }
    else if (d.status === 'delivered') { d.status = 'released'; a.wallet += d.amount; addLog(d, `${who} دریافت را تأیید کرد و ${short(d.amount)} تومان به حساب شما واریز شد`); }
    commit();
  },
  'add-coll': () => collSheet(),
};

const forms = {
  phone() {
    const p = digits($('#phone').value);
    if (!/^09\d{9}$/.test(p)) { ui.auth.err = 'شماره موبایل باید ۱۱ رقم باشد و با ۰۹ شروع شود.'; ui.auth.phone = p; render(); return $('#phone').focus(); }
    Object.assign(ui.auth, { phone: p, err: '' });
    if (S.accounts[p]) Object.assign(ui.auth, { step: 'otp', nid: '', code: newCode(), sentAt: Date.now() });
    else ui.auth.step = 'nid';
    render(); $('#otp, #nid')?.focus();
  },
  nid() {
    const n = digits($('#nid').value);
    if (!validNid(n)) { Object.assign(ui.auth, { nid: n, err: 'این کد ملی معتبر نیست. ۱۰ رقم را دوباره بررسی کنید.' }); render(); return $('#nid').focus(); }
    Object.assign(ui.auth, { nid: n, err: '', step: 'otp', code: newCode(), sentAt: Date.now() });
    render(); $('#otp').focus();
  },
  otp() {
    const a = ui.auth;
    if (digits($('#otp').value) !== a.code) { a.err = 'کد واردشده درست نیست.'; render(); return $('#otp').focus(); }
    const isNew = !S.accounts[a.phone];
    if (isNew) S.accounts[a.phone] = seed(a.nid);
    S.session = S.lastPhone = a.phone;
    ui.view = 'home';
    commit(isNew ? 'حساب شما ساخته شد. چند معامله نمونه برای آشنایی اضافه کردیم.' : 'خوش آمدید');
  },
  create() {
    const role = document.querySelector('[name=role]:checked').value, title = $('#title').value.trim(), cpPhone = digits($('#cpPhone').value), amount = +digits($('#amount').value);
    const [err, field] = amount < 100000 ? ['مبلغ معامله دست‌کم ۱۰۰ هزار تومان است.', 'amount'] : !title ? ['موضوع معامله را بنویسید.', 'title'] : !/^09\d{9}$/.test(cpPhone) ? ['موبایل طرف مقابل باید ۱۱ رقم باشد و با ۰۹ شروع شود.', 'cpPhone'] : cpPhone === S.session ? ['نمی‌توانید با شماره خودتان معامله کنید.', 'cpPhone'] : [];
    if (err) { document.querySelectorAll('[data-form=create] [aria-invalid]').forEach(e => e.removeAttribute('aria-invalid')); $('#' + field).setAttribute('aria-invalid', 'true'); $('#create-err').textContent = err; return $('#' + field).focus(); }
    const d = { id: uid(), byMe: true, role, title, cpPhone, cpName: $('#cpName').value.trim(), amount, days: +$('#days').value, terms: $('#terms').value.trim(), status: 'invited', log: [] };
    addLog(d, 'معامله را ایجاد کردید و دعوت ارسال شد');
    acc().deals.unshift(d);
    ui.from = 'deals'; ui.view = 'deal'; ui.dealId = d.id;
    commit(`دعوت برای ${faD(cpPhone)} ارسال شد`); window.scrollTo(0, 0);
  },
  fund(f) {
    const d = findDeal(f.dataset.id), src = f.querySelector('[name=src]:checked')?.value, a = acc();
    if (!src) return fail('fund-err', 'محل تأمین مبلغ را انتخاب کنید.');
    if (src === 'wallet') a.wallet -= d.amount;
    d.source = src; d.status = 'funded';
    addLog(d, `${short(d.amount)} تومان از ${src === 'wallet' ? 'موجودی حساب' : 'اعتبار سپار'} بلوکه شد`);
    commit('مبلغ بلوکه شد. فروشنده می‌تواند کالا را ارسال کند.');
  },
  ship(f) {
    const w = $('#waybill').value.trim();
    if (!w) return fail('ship-err', 'شماره بارنامه یا کد رهگیری را وارد کنید.');
    const d = findDeal(f.dataset.id); d.status = 'delivered'; addLog(d, `ارسال کالا را ثبت کردید (بارنامه ${w})`);
    commit('ارسال ثبت شد. منتظر تأیید خریدار هستیم.');
  },
  dispute(f) {
    const r = $('#reason').value.trim();
    if (r.length < 10) return fail('dispute-err', 'مشکل را دست‌کم در یک جمله توضیح دهید.');
    const d = findDeal(f.dataset.id); d.prev = d.status; d.status = 'disputed'; addLog(d, `اختلاف ثبت کردید: ${r}`);
    commit('اختلاف ثبت شد');
  },
  coll() {
    const type = document.querySelector('[name=ctype]:checked').value, amount = +digits($('#c-amount').value), ref = toEn($('#c-ref').value.trim());
    const err = amount < 1000000 ? 'مبلغ وثیقه دست‌کم ۱ میلیون تومان است.' : type === 'cheque' && !/^\d{16}$/.test(digits(ref)) ? 'شناسه صیادی ۱۶ رقم است.' : !ref ? `${COLL[type].ref} را وارد کنید.` : '';
    if (err) return fail('coll-err', err);
    acc().collaterals.push({ id: uid(), type, amount, ref, status: 'pending', at: Date.now(), reviewAt: Date.now() + 6000 });
    commit('وثیقه ثبت شد و در حال بررسی است');
  },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) { e.preventDefault(); acts[b.dataset.act](b.dataset.id, b); }
});
document.addEventListener('submit', e => { e.preventDefault(); forms[e.target.dataset.form](e.target); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'otp') {
    const v = digits(t.value).slice(0, 5); t.value = v;
    t.parentElement.querySelectorAll('span').forEach((s, i) => { s.textContent = v[i] ? faD(v[i]) : ''; s.classList.toggle('cur', i === Math.min(v.length, 4)); });
    if (v.length === 5) t.form.requestSubmit();
  }
  if (t.matches('[data-money]')) {
    const n = +digits(t.value);
    t.value = n ? fa(n) : '';
    const w = $('#' + t.id + '-words'); if (w) w.textContent = n ? words(n) + ' تومان' : '';
  }
  if (t.closest('[data-form="coll"]')) {
    const type = document.querySelector('[name=ctype]:checked').value, n = +digits($('#c-amount').value);
    $('#c-ref-label').textContent = COLL[type].ref;
    $('#c-preview').textContent = n ? `پس از تأیید، ${toman(Math.round(n * COLL[type].cov))} به سقف اعتبار شما اضافه می‌شود.` : 'مبلغ وثیقه را وارد کنید تا اعتبار حاصل از آن را ببینید.';
  }
});
document.addEventListener('focusin', e => { if (e.target.id === 'otp') e.target.parentElement.querySelectorAll('span').forEach((s, i) => s.classList.toggle('cur', i === Math.min(e.target.value.length, 4))); });

// collateral review + OTP countdown
setInterval(() => {
  if (!S.session) {
    const r = $('#resend'); if (!r) return;
    const left = Math.max(0, 60 - Math.floor((Date.now() - ui.auth.sentAt) / 1000));
    r.disabled = left > 0; r.textContent = left ? `ارسال دوباره تا ${fa(left)} ثانیه` : 'ارسال دوباره کد';
    return;
  }
  // ponytail: review is a 6-second timer standing in for the bank's collateral check
  const due = acc().collaterals.filter(c => c.status === 'pending' && c.reviewAt <= Date.now());
  if (!due.length) return;
  due.forEach(c => c.status = 'approved');
  save();
  toast(`${COLL[due[0].type].name} تأیید شد و ${short(due.reduce((s, c) => s + c.amount * COLL[c.type].cov, 0))} تومان به اعتبار شما اضافه شد`);
  if (['credit', 'home'].includes(ui.view) && !sheet.open) render();
}, 1000);

function render() {
  $('#app').innerHTML = S.session && acc() ? shell() : authView();
}
addEventListener('scroll', () => document.documentElement.toggleAttribute('data-scrolled', scrollY > 4), { passive: true });
render();
</script>

</html>
